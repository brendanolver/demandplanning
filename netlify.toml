[build]
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  # @netlify/blobs (added for planning-globals.js) needs Node >=22.12 — this
  # site predates package.json entirely, so its pinned Node version is
  # whatever it happened to default to when first created, not something to
  # assume is new enough. Pin explicitly rather than risk the build failing.
  NODE_VERSION = "22"
